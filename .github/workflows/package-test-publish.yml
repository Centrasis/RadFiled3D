name: Python packaging testing

on: [push]

jobs:
  memory-safety-linux:
    name: C++ memory safety (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Configure C++ tests with Address + UndefinedBehavior sanitizers
      # RS_Build_PyBindings=OFF: build only the core library and its C++ gtest suite. An ASan-instrumented
      # Python extension loaded by a stock CPython needs LD_PRELOAD gymnastics and trips interpreter-internal
      # checks, so the pure C++ tests give the clean, high-signal memory-safety coverage.
      # -fno-sanitize-recover=all makes a UBSan finding abort (non-zero exit) so it fails the job like ASan.
      run: >
        cmake -S . -B build-asan
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DBUILD_TESTS=ON
        -DRS_Build_PyBindings=OFF
        -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
    # MemoryTest is intentionally excluded: its 500-/1000-iteration create/store/load loops are slow under
    # ASan, and the sanitizers surface any use-after-free / leak-shaped bug on the other suites without it.
    - name: Build C++ tests
      run: cmake --build build-asan --target basic_test tracing_test AccessorTest SphericalTest VmfTest BufferCopyTest VoxelCountTest -j
    - name: Run C++ tests under sanitizers
      working-directory: build-asan
      env:
        # Leak detection off: gate on memory corruption (use-after-free, overflow, wrong-size/mismatched
        # delete) and UB — the classes that crash — not on one-off allocations.
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        set -e
        for t in basic_test tracing_test AccessorTest SphericalTest VmfTest BufferCopyTest VoxelCountTest; do
          bin=$(find . -name "$t" -type f -perm -u+x | head -1)
          echo "=== running $t ($bin) ==="
          "$bin"
        done
  build-source:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: 3.13
    - name: Build RadFiled3D Source Distribution
      run: |
        python -m pip install build
        python -m build --sdist
    - name: Lint with flake8
      run: |
        python -m pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Verify the sdist compiles and keeps its version without CI variables
      # Regression test for source installs on platforms that have no wheel.
      # The dynamic version provider must fall back to the sdist's PKG-INFO when
      # no CI tag variable is set (as on a user's machine); otherwise the built
      # wheel claims 0.0.0, pip reports "has inconsistent version: expected
      # X.Y.Z, but metadata has 0.0.0" and discards the sdist, so
      # `pip install RadFiled3D` fails instead of compiling on the fly.
      run: |
        set -e
        sdist=$(ls dist/*.tar.gz)
        expected=$(basename "$sdist" .tar.gz | sed 's/^radfiled3d-//')
        python -m venv /tmp/sdist-check
        env -u GITHUB_REF -u GITHUB_REF_NAME -u GITHUB_REF_TYPE \
            -u CI_COMMIT_TAG -u CI_COMMIT_REF_NAME \
          /tmp/sdist-check/bin/pip install --no-deps "$sdist"
        installed=$(/tmp/sdist-check/bin/python -c "import importlib.metadata as m; print(m.version('RadFiled3D'))")
        echo "sdist declares '$expected', source install produced '$installed'"
        test "$expected" = "$installed"
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-source-artifact
        path: dist/*.tar.gz
  build-windows:
    runs-on: windows-latest
    strategy:
      max-parallel: 5
      matrix:
        include:
          - python-version: 3.12
            python-name: cp312
          - python-version: 3.13
            python-name: cp313
          - python-version: 3.14
            python-name: cp314
    steps:
    - uses: actions/checkout@v7
    - name: Install compiler
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Set up Clang
      uses: egor-tensin/setup-clang@v2
      with:
        version: latest
        platform: x64
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build RadFiled3D Wheel
      run: |
        python -m pip install build
        python -m build --wheel
    - name: Lint with flake8
      run: |
        python -m pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Install built wheel ${{ matrix.python-version }}
      run: |
        $whl = Get-ChildItem -Path dist\*.whl | Select-Object -First 1
        python -m pip install $whl.FullName
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-windows-artifact-${{ matrix.python-version }}
        path: dist/*.whl
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        include:
          - python-version: 3.11
            python-name: cp311
          - python-version: 3.12
            python-name: cp312
          - python-version: 3.13
            python-name: cp313
          - python-version: 3.14
            python-name: cp314
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Define CIBW_BUILD variable
      run: |
        PYTHON_VERSION=${{ matrix.python-version }}
        export CIBW_BUILD="${{ matrix.python-name }}-manylinux_x86_64"
    - name: Build RadFiled3D Wheel for glibc 2.28
      uses: pypa/cibuildwheel@v4.2.1
      env:
        CIBW_BUILD_FRONTEND: "build"
        CIBW_ARCHS: "x86_64"
        CIBW_ENVIRONMENT_PASS_LINUX: "GITHUB_REF"
        CIBW_BUILD: "${{ matrix.python-name }}-manylinux_x86_64"
        CIBW_PROJECT_REQUIRES_PYTHON: ">=3.11"
        CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
        CIBW_MANYLINUX_PYPY_X86_64_IMAGE: "manylinux_2_28"
        # DType.FLOAT16 needs _Float16 (GCC >= 12). manylinux_2_28 (AlmaLinux 8) can provide it,
        # so build these wheels with a modern gcc-toolset so they ship float16 support.
        CIBW_BEFORE_ALL: "dnf install -y gcc-toolset-13-gcc gcc-toolset-13-gcc-c++"
        CIBW_ENVIRONMENT: "CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++"
      with:
        output-dir: dist
    - name: Install built wheel ${{ matrix.python-version }}
      run: |
        python -m pip install ./dist/*.whl
    # NOTE: manylinux2014 (CentOS 7) tops out at GCC <= 11, which lacks x86 _Float16, so these
    # glibc 2.17 wheels are built without float16 support (it is compiled out and DType.FLOAT16
    # raises a clear error at runtime). Kept for maximum backwards compatibility on old systems.
    - name: Build RadFiled3D Wheel for glibc 2.17
      uses: pypa/cibuildwheel@v4.2.1
      env:
        CIBW_BUILD_FRONTEND: "build"
        CIBW_ARCHS: "x86_64"
        CIBW_ENVIRONMENT_PASS_LINUX: "GITHUB_REF"
        CIBW_BUILD: "${{ matrix.python-name }}-*"
        CIBW_PROJECT_REQUIRES_PYTHON: ">=3.11"
        CIBW_MANYLINUX_X86_64_IMAGE: "manylinux2014"
        CIBW_MANYLINUX_PYPY_X86_64_IMAGE: "manylinux2014"
      with:
        output-dir: dist
    - name: Lint with flake8
      run: |
        python -m pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-linux-artifact-${{ matrix.python-version }}
        path: dist/*.whl
  build-macos:
    name: Build macOS wheel (${{ matrix.arch }} ${{ matrix.python-name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One job per architecture *and* python version, like build-linux and build-windows.
      # Building all four interpreters inside a single cibuildwheel run made this the
      # slowest job in the workflow, since each wheel is also test-run.
      max-parallel: 8
      matrix:
        arch: [arm64, x86_64]
        python-name: [cp311, cp312, cp313, cp314]
        include:
          - arch: arm64
            runner: macos-15
            # arm64 macOS starts at 11.0.
            deployment-target: "11.0"
          - arch: x86_64
            runner: macos-15-intel
            # std::filesystem (radiation_field_store, file_lock) is only available
            # from macOS 10.15; building against an older target fails with
            # "introduced in macOS 10.15" availability errors.
            deployment-target: "10.15"
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      # Host interpreter for cibuildwheel only; it provisions the CPython it builds against.
      uses: actions/setup-python@v7
      with:
        python-version: 3.13
    - name: Build RadFiled3D wheel for macOS
      uses: pypa/cibuildwheel@v4.2.1
      env:
        CIBW_BUILD_FRONTEND: "build"
        CIBW_BUILD: "${{ matrix.python-name }}-*"
        CIBW_ARCHS_MACOS: ${{ matrix.arch }}
        CIBW_PROJECT_REQUIRES_PYTHON: ">=3.11"
        MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
        # Apple clang provides _Float16 on arm64 and on recent x86_64 targets;
        # where it does not, helpers/typing.hpp compiles float16 out and DType.FLOAT16
        # raises at runtime, exactly as on the glibc 2.17 Linux wheels.
        CIBW_TEST_REQUIRES: "pytest numpy"
        CIBW_TEST_COMMAND: "python -m pytest {project}/tests"
      with:
        output-dir: dist
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-macos-artifact-${{ matrix.arch }}-${{ matrix.python-name }}
        path: dist/*.whl
  test-linux:
    strategy:
      max-parallel: 5
      matrix:
        include:
          - python-version: 3.11
            python-name: cp311
          - python-version: 3.12
            python-name: cp312
          - python-version: 3.13
            python-name: cp313
          - python-version: 3.14
            python-name: cp314
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    name: Test on Linux ${{ matrix.python-version }}
    needs:
      - build-linux
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-linux-artifact-${{ matrix.python-version }}
          path: dist/
      - name: Install built wheel ${{ matrix.python-version }}
        run: |
          python -m pip install ./dist/*manylinux_2_28_x86_64.whl
      - name: Test with pytest
        run: |
          python -m pip install pytest numpy
          python -m pytest tests/ --junit-xml=test-results.xml
      - name: Surface failing tests
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          path: test-results.xml
          summary: true
          display-options: fEX
          fail-on-empty: true
          title: Test results py${{ matrix.python-version }} (Linux)
  test-windows:
    strategy:
      max-parallel: 5
      matrix:
        include:
          - python-version: 3.12
            python-name: cp312
          - python-version: 3.13
            python-name: cp313
          - python-version: 3.14
            python-name: cp314
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    name: Test on Windows ${{ matrix.python-version }}
    needs:
      - build-windows
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-windows-artifact-${{ matrix.python-version }}
          path: dist/
      - name: Install built wheel ${{ matrix.python-version }}
        run: |
          $whl = Get-ChildItem -Path dist\*.whl | Select-Object -First 1
          python -m pip install $whl.FullName
      - name: Test with pytest
        run: |
          python -m pip install pytest numpy
          python -m pytest tests/
  publish-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        include:
          - python-version: 3.11
            python-name: cp311
          - python-version: 3.12
            python-name: cp312
          - python-version: 3.13
            python-name: cp313
          - python-version: 3.14
            python-name: cp314
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish on Linux ${{ matrix.python-version }}
    needs:
      - test-linux
    environment:
      name: pypi
      url: https://pypi.org/p/RadFiled3D
    permissions:
      id-token: write
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: build-linux-artifact-${{ matrix.python-version }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
  publish-source:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish source distribution
    needs:
      - build-source
      - test-linux
    environment:
      name: pypi
      url: https://pypi.org/p/RadFiled3D
    permissions:
      id-token: write
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: build-source-artifact
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
  publish-windows:
    strategy:
      max-parallel: 5
      matrix:
        include:
          - python-version: 3.12
            python-name: cp312
          - python-version: 3.13
            python-name: cp313
          - python-version: 3.14
            python-name: cp314
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish on Windows ${{ matrix.python-version }}
    needs:
      - test-windows
    environment:
      name: pypi
      url: https://pypi.org/p/RadFiled3D
    permissions:
      id-token: write
    steps:
      - name: Configure .pypirc
        run: |
          echo "[distutils]" > ~/.pypirc
          echo "index-servers = pypi RadFiled3D" >> ~/.pypirc
          echo "[pypi]" >> ~/.pypirc
          echo "repository: https://upload.pypi.org/legacy/" >> ~/.pypirc
          echo "username: __token__" >> ~/.pypirc
          echo "password: ${{ secrets.TWINE_PASSWORD }}" >> ~/.pypirc
          echo "[RadFiled3D]" >> ~/.pypirc
          echo "repository: https://upload.pypi.org/legacy/" >> ~/.pypirc
          echo "username: __token__" >> ~/.pypirc
          echo "password: ${{ secrets.TWINE_PASSWORD }}" >> ~/.pypirc
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: build-windows-artifact-${{ matrix.python-version }}
          path: dist/
      - name: Publish to PyPI
        run: |
          $whl = Get-ChildItem -Path dist\*.whl | Select-Object -First 1
          python -m pip install twine
          python -m twine upload --repository RadFiled3D $whl.FullName
  publish-macos:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 8
      matrix:
        arch: [arm64, x86_64]
        python-name: [cp311, cp312, cp313, cp314]
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish on macOS ${{ matrix.arch }} ${{ matrix.python-name }}
    # cibuildwheel runs the pytest suite against each macOS wheel it builds, so
    # build-macos is the equivalent gate that test-linux is for the Linux wheels.
    needs:
      - build-macos
    environment:
      name: pypi
      url: https://pypi.org/p/RadFiled3D
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: build-macos-artifact-${{ matrix.arch }}-${{ matrix.python-name }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
