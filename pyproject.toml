[build-system]
requires = ["scikit-build-core>=1.0.3", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "RadFiled3D"
dynamic = ["version"]
description = "Storage and tooling for 3D radiation fields with C++ core and Python bindings."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Felix Lehner", email = "felix.lehner@ptb.de" }]
dependencies = [
    "numpy>=2.0",
    "rich>=13.9",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://pypi.org/project/RadFiled3D/"

# ---------------------------------------------------------------------------
# scikit-build-core: drives the CMake/pybind11 build the standard PEP 517 way.
# ---------------------------------------------------------------------------
[tool.scikit-build]
# Pure-python sources live under python/RadFiled3D and map to the RadFiled3D
# package; the native pybind module (and its .pyi stub) is added into the same
# package by CMake's install() rules.
wheel.packages = ["python/RadFiled3D"]
cmake.version = ">=3.16"
cmake.build-type = "Release"
build.verbose = false
# Required to load the local version provider in build_tools/ (see below).
experimental = true

# Tests/examples are C++-only and not part of the wheel.
[tool.scikit-build.cmake.define]
BUILD_TESTS = "OFF"
BUILD_EXAMPLES = "OFF"
RS_Build_PyBindings = "ON"

# Version is derived from the CI tag / git ref (GITHUB_REF, CI_COMMIT_TAG, ...).
# See build_tools/radfiled3d_version.py. This is the standard top-level
# dynamic-metadata form; the older [tool.scikit-build.metadata.version] table is
# deprecated in scikit-build-core 1.x.
[[tool.dynamic-metadata]]
field = "version"
provider = { module = "radfiled3d_version", path = "build_tools" }

# Files needed to build from an sdist (the C++ sources, bindings, stubs and the
# version provider). Pure-python under python/ is included automatically.
[tool.scikit-build.sdist]
# NOTE: sdist.include overrides sdist.exclude *and* .gitignore, so these are
# listed as file patterns rather than whole directories -- a bare "python/"
# force-included every nested __pycache__ back into the tarball.
include = [
    "CMakeLists.txt",
    "LICENSE",
    "README.md",
    "include/**/*.hpp",
    "src/*.cpp",
    "python/bindings/*.cpp",
    "python/RadFiled3D/**/*.py",
    "python/RadFiled3D/RadFiled3D.pyi",
    "python/RadFiled3D/py.typed",
    "build_tools/*.py",
    "tests/*.py",
    "tests/*.cpp",
]
# Keep local build trees, editor/tooling state and other untracked dev artifacts
# out of the published source distribution.
exclude = [
    "build",
    "build/**",
    "build_cpp",
    "build_cpp/**",
    "lib",
    "lib/**",
    ".vscode",
    ".vscode/**",
    ".claude",
    ".claude/**",
    ".pytest_cache",
    ".pytest_cache/**",
    "plan.md",
    "*.rf3",
    "*.log",
    # Recursive patterns: a bare "*.pyc" only matches the top level, which used
    # to let every nested __pycache__ directory leak into the sdist.
    "**/__pycache__",
    "**/__pycache__/**",
    "**/*.pyc",
    # Repo-only material that is not needed to build from source.
    ".github",
    ".github/**",
    "openwiki",
    "openwiki/**",
    "docs",
    "docs/**",
    "AGENTS.md",
]
